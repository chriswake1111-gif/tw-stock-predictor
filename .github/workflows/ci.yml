name: Anti-Gravity TU Predictor CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Validate Phase 9 frontend
      working-directory: frontend
      run: |
        npm run lint
        npm run typecheck
        npm run test
        npm run build
        npm run test:visual

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt

    - name: Run PyTest test suite
      run: |
        python -m pytest -q -p no:cacheprovider

    - name: Reject tracked runtime cache files
      shell: bash
      run: |
        if git ls-files | grep -E '(^|/)(__pycache__/|data/cache\.db$)|\.py[co]$'; then
          echo "Tracked runtime cache files are not allowed."
          exit 1
        fi

    - name: Validate Windows packaging source contracts
      shell: bash
      run: |
        python -B -m py_compile tools/build_windows_package.py tools/validate_windows_package.py packaging/windows/*.py
