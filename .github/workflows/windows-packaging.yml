name: TW Stock Predictor Windows Productization

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/windows-packaging.yml"
      - ".github/scripts/windows-packaging-smoke.ps1"
      - "packaging/windows/**"
      - "src/runtime/**"
      - "src/api/**"
      - "src/repositories/migration_runner.py"
      - "src/services/evidence_backup_service.py"
      - "tools/build_windows_package.py"
      - "tools/validate_windows_package.py"
      - "tests/test_phase18_runtime.py"
      - "frontend/**"

jobs:
  package-and-smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Inno Setup 6.4.2
        shell: pwsh
        run: choco install innosetup --version=6.4.2 --allow-downgrade --no-progress --yes

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r packaging/windows/requirements-build.txt

      - name: Run Phase 18 runtime tests on Windows
        shell: pwsh
        run: python -B -m pytest tests/test_phase18_runtime.py -q -p no:cacheprovider

      - name: Build frontend from source
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          npm run build

      - name: Build Windows onedir package and installer
        shell: pwsh
        run: >-
          python -B tools/build_windows_package.py
          --skip-frontend
          --iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Validate finalized package manifests and onedir layout
        shell: pwsh
        run: >-
          python -B tools/validate_windows_package.py
          dist/windows-productization
          --distribution-manifest
          dist/windows-productization/distribution-manifest.json

      - name: Run installed clean-machine smoke
        shell: pwsh
        run: >-
          .github/scripts/windows-packaging-smoke.ps1
          -PackageRoot "$env:GITHUB_WORKSPACE\dist\windows-productization"
          -InstallRoot "$env:RUNNER_TEMP\tw-stock-predictor-install"
          -UserRoot "$env:RUNNER_TEMP\tw-stock-predictor-user"

      - name: Write packaging evidence to job summary
        if: always()
        shell: pwsh
        run: |
          $summary = "$env:GITHUB_WORKSPACE\dist\windows-productization\build-summary.json"
          $smoke = "$env:GITHUB_WORKSPACE\dist\windows-productization\smoke-summary.json"
          if (Test-Path -LiteralPath $summary) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '## Build summary'
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```json'
            Get-Content -LiteralPath $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```'
          }
          if (Test-Path -LiteralPath $smoke) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '## Installed smoke summary'
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```json'
            Get-Content -LiteralPath $smoke | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```'
          }
