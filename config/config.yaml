# 杜金龍台股量化預測系統 - 全局配置檔 (config.yaml)

model:
  version: "1.x"
  legacy: true
  official_affiliation: false
  rules_registry: "config/model_rules.yaml"

database:
  db_path: "data/cache.db"

fibonacci:
  numbers: [8, 13, 21, 34, 55, 89, 144, 233]
  ratios: [0.382, 0.5, 0.618, 1.0, 1.382, 1.618, 2.0, 2.618, 3.236]

valuation:
  pe_min: 10.0
  pe_mid: 20.0
  pe_max: 25.0
  pb_max: 1.5
  yield_min: 0.04
  default_wacc: 0.07          # EVA 資金成本 (7%)
  default_eps_growth: 0.10     # 預設雙軌 EPS 成長率 (10%)

sentiment:
  turnover_m1b_threshold: 0.020       # 大盤單日成交金額 / M1B 頭部過熱臨界比率
  margin_balance_growth_threshold: 0.08  # 融資餘額觀察期成長率警示門檻 (8%)

# Evidence Model v2 Phase 3 project-operationalized context thresholds.
# These classify historical percentile context; they are not sell/top signals.
liquidity_v2:
  elevated_percentile: 80.0
  historically_high_percentile: 95.0
  min_observations_5y: 1000
  min_observations_10y: 2000

notifier:
  # LINE Messaging API (LINE Bot) 推播金鑰與 User ID
  line_token: ""
  line_user_id: ""
  # Telegram Bot
  telegram_token: ""
  telegram_chat_id: ""
  # Discord Webhook URL
  discord_webhook: ""
